[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usbphone-control"
version = "0.1.0"
description = "A handwritten USB-only Android observation and action toolkit, with CLI and MCP interfaces."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.20,<2"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1,<2", "mcp>=1.20,<2"]

[project.scripts]
usbphone = "usbphone.cli:main"
usbphone-mcp = "usbphone.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/usbphone"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
