[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usbphone-control"
version = "0.2.0"
description = "A handwritten USB-only Android observation and action toolkit, with CLI and MCP interfaces."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1,<2", "mcp>=2.3,<3"]

[project.scripts]
usbphone = "usbphone.cli:main"
usbphone-mcp = "usbphone.mcp_server:main"

[project.urls]
Repository = "https://github.com/obsessed-star/usbphone-control"
Issues = "https://github.com/obsessed-star/usbphone-control/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/usbphone"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
